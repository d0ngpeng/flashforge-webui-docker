version: "3.8"

services:
  flashforge-webui:
    image: ghcr.io/d0ngpeng/flashforge-webui-docker:v1.2.0-alpha.7
    container_name: flashforge-webui
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    command: ["--all-saved-printers", "--webui-port=3000", "--webui-password=changeme"]
    
    # Optional: add device access for printer communication
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    
    # Optional: network configuration for printer access
    # network_mode: host
    
    healthcheck:
      test: ["CMD", "curl", "-sfS", "http://127.0.0.1:3000/"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

    # Optional: deploy config for Docker Swarm
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

    # Optional: environment variables
    # environment:
    #   - PORT=3000
    #   - PASSWORD=yourpassword

    # Optional: logging
    # logging:
    #   driver: json-file
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

name: Build and Push to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.tag'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g., v1.2.0-alpha.7)'
        required: false
        default: 'v1.2.0-alpha.7'
  schedule:
    - cron: '0 6 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine build tag
        id: tag
        run: |
          if [ "${{ github.event.inputs.tag }}" != "" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [ -f ".tag" ]; then
            echo "tag=$(cat .tag)" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.2.0-alpha.7" >> $GITHUB_OUTPUT
          fi
          echo "Building image for tag: ${{ steps.tag.outputs.tag }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            REPO=Parallel-7/FlashForgeWebUI
            TAG=${{ steps.tag.outputs.tag }}
            BIN_NAME=flashforge-webui-linux-x64.bin
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=FlashForgeWebUI Docker
            org.opencontainers.image.description=FlashForgeWebUI Docker image from Parallel-7/FlashForgeWebUI ${{ steps.tag.outputs.tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify push
        run: |
          echo "Image ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} pushed successfully!"

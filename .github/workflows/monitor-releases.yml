name: Monitor Upstream Releases

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: Parallel-7/FlashForgeWebUI

jobs:
  check-new-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get latest release tag
        id: latest
        run: |
          LATEST=$(curl -sf "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases" | grep -oP '"tag_name": "\Kv[^"]*' | head -1)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest upstream release: $LATEST"

      - name: Check if release is new
        id: check
        run: |
          LATEST="${{ steps.latest.outputs.latest }}"
          CURRENT=$(cat .tag 2>/dev/null || echo "")
          echo "Current tag in .tag: $CURRENT"
          echo "Latest upstream tag: $LATEST"
          
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "new=true" >> $GITHUB_OUTPUT
            echo "New release detected: $LATEST (current: $CURRENT)"
          else
            echo "new=false" >> $GITHUB_OUTPUT
            echo "No new release detected"
          fi

      - name: Update .tag and push to trigger build
        if: steps.check.outputs.new == 'true'
        run: |
          echo "${{ steps.latest.outputs.latest }}" > .tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .tag
          git commit -m "Update tag to ${{ steps.latest.outputs.latest }} (upstream release)"
          git push
          echo "Updated .tag to ${{ steps.latest.outputs.latest }} - build will be triggered"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
